# 改规则后：validate --config 本文件，已运行则 reload，未运行则 start。
name: inbox
max_parallel_jobs: 1
watch:
  path: ./inbox
  recursive: true
  debounce_ms: 400
  # 可读文本行级 diff：该文件再安静这么久才结算一次（默认 2 秒）
  line_diff_quiet_ms: 2000
  ignore:
    - "**/.git/**"
    - "**/__pycache__/**"
    - "**/.venv/**"
    - "**/*.tmp"
rules:
  - name: any-file-change
    when:
      types: [created, modified]
      glob: "**/*"
      is_dir: false
      # 省略 active 则一直生效。工作日白天示例：
      # active:
      #   start: "09:00"
      #   end: "18:00"
      #   days: [mon, tue, wed, thu, fri]
    then:
      - notify:
          title: "文件有变化"
          message: "{{type}}: {{path}}"
          mailbox: true
          # 取消注释后，命中事件每分钟汇总推送到钉钉群（无变化不发送）。
          # dingtalk: true   # 使用设置页默认钉钉渠道
          # 或 dingtalk: { channel: work }

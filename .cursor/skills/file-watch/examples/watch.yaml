name: inbox
max_parallel_jobs: 1
watch:
  path: ./inbox
  recursive: true
  debounce_ms: 400
  ignore:
    - "**/.git/**"
    - "**/__pycache__/**"
    - "**/.venv/**"
    - "**/*.tmp"
rules:
  - name: any-file-change
    when:
      types: [created, modified]
      glob: "**/*"
      is_dir: false
    then:
      - notify:
          title: "文件有变化"
          message: "{{type}}: {{path}}"
          mailbox: true

# 改规则后：validate --config 本文件，已运行则 reload，未运行则 start。
# 任务显示名，默认用文件夹名。CLI --id 请用 list 里的 watch_id，不要用本字段。
name: inbox
max_parallel_jobs: 1
watch:
  path: ./inbox
  recursive: true
  debounce_ms: 400
  # 可读文本行级 diff：该文件再安静这么久才结算一次（默认 30 秒）
  line_diff_quiet_ms: 30000
  # 超过这个大小不做行级对比（默认 256KB）
  line_diff_max_bytes: 262144
  # record_all: false   # 仅记录命中正向规则的文件；省略或 true 则默认记录全部变化
  ignore:
    - "**/.git/**"
    - "**/__pycache__/**"
    - "**/.venv/**"
    - "**/*.tmp"
rules:
  - name: any-file-change
    when:
      types: [created, modified]
      glob: "**/*"
      is_dir: false
      # 省略 active 则一直生效。工作日白天示例：
      # active:
      #   start: "09:00"
      #   end: "18:00"
      #   days: [mon, tue, wed, thu, fri]
    then:
      - notify:
          title: "文件有变化"
          message: "{{type}}: {{path}}"
          mailbox: true
          # 取消注释后，命中事件每分钟汇总推送到钉钉群（无变化不发送）。
          # 若同一规则还有 builtin 智能体，完成后会立刻推送最后一轮回复。
          # dingtalk: true   # 使用设置页默认钉钉渠道
          # 或 dingtalk: { channel: work }
  # 反向规则：命中后不入账（文件变化和其它规则都不会触发）。record_all 为 true（默认）时仍会记录未排除的文件。
